<!DOCTYPE html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./web/src/styles/style.css" />
    <link rel="stylesheet" href="./web/src/styles/termos-condições.css" />
    <title>CIEEMG</title>    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />        
  <script defer src="bundle.js"></script></head>
  <body>
    <header>
      <div class="top-menu">
        <div class="button-menu-mobile show-menu-side">
          <button class="show-menu-side">
            <img
              class="show-menu-side"
              src="./web/src/assets/images/menu.png"
              alt="Abrir menu."
            />
          </button>
        </div>
      </div>
    </header>
    <main class="screen-main">
      <div class="sub-main-title">
        <h1 class="h1-sub-title">Termos e condições</h1>
      </div>
      <nav class="screen screen-terms-conditions">
        <div class="termos-box">
          <p class="class-p">
            Prezado usuário, para continuar utilizando os serviços de nosso
            portal, você precisa primeiramente ler e aceitar os nossos termos e
            condições de uso. Clique no botão abaixo para acessar os termos.
          </p>
          <!-- <div class="div-button"> -->
          <button class="button-termo">Leia os termos e condições</button>
          <!-- </div> -->
          <div>
            <input class="checkbox" type="checkbox" name="Li e concordo" />
            <label class="input-li" for="li e concordo"
              >Li e concordo com os termos e condições</label
            >
          </div>
          <div>
            <button class="button-termo-1">Avançar</button>
          </div>
        </div>
      </nav>
      <nav class="screen screen-basic-data1"></nav>
      <nav class="screen screen-address"></nav>
      <nav class="screen screen-school-data"></nav>
    </main>
    <nav class="fixed">
      <nav class="nav-bar position main">
        <div class="container main">
          <img
            class="main"
            src="./web/src/assets/images/AF_CIEE-CURVA-PANTONE_VersaoSVG-3.svg"
            alt="Logo do CIEEMG"
          />
        </div>
        <div class="main-side main">
          <ul class="main">
            <li class="list-item terms-conditions main">
              <img
                class="terms-conditions main"
                src="./web/src/assets/images/terms-32.png"
                alt="Termos e condições"
              /><a class="terms-conditions main" href="#">Termos e condições</a>
            </li>
            <li class="list-item basic-data main">
              <img
                class="basic-data main"
                src="./web/src/assets/images/basic-data-32.png"
                alt="Dados básicos"
              /><a class="basic-data main" href="#">Dados básicos</a>
            </li>
            <li class="list-item address main">
              <img
                class="address main"
                src="./web/src/assets/images/address-32.png"
                alt="Endereço"
              /><a class="address main" href="#">Endereço</a>
            </li>
            <li class="list-item school-data main">
              <img
                class="school-data main"
                src="./web/src/assets/images/school-data-32.png"
                alt="Dados acadêmicos"
              /><a class="school-data main" href="#">Dados acadêmicos</a>
            </li>
          </ul>
        </div>
        <div class="main-side-mobile main">
          <ul class="main">
            <li class="list-item terms-conditions main">
              <img
                class="terms-conditions main"
                src="./web/src/assets/images/terms-32.png"
                alt="Termos e condições"
              />
            </li>
            <li class="list-item basic-data main">
              <img
                class="basic-data main"
                src="./web/src/assets/images/basic-data-32.png"
                alt="Dados básicos"
              />
            </li>
            <li class="list-item address main">
              <img
                class="address main"
                src="./web/src/assets/images/address-32.png"
                alt="Endereço"
              />
            </li>
            <li class="list-item school-data main">
              <img
                class="school-data main"
                src="./web/src/assets/images/school-data-32.png"
                alt="Dados Acadêmicos"
              />
            </li>
          </ul>
        </div>
      </nav>
    </nav>
    <script src="web/src/assets/js/bundle.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js" integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  </body>
</html>
